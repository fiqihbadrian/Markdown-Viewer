[package]
name = "markdown-viewer"
version = "1.2.1"
description = "MarkdownViewer untuk Windows dan Linux"
authors = ["Fiqih Badrian"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "markdown_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
