<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;">
  <title>MarkdownViewer</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="print.css">
</head>
<body data-theme="system">
  <header class="toolbar">
    <div class="title">
      <span class="icon">📄</span>
      <span id="fileName">Belum ada file</span>
    </div>
    <div class="actions">
      <button id="btnOpen" title="Buka file (Ctrl+O)">Buka</button>
      <select id="theme" title="Tema preview">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
        <option value="github-light">GitHub Light</option>
        <option value="github-dark">GitHub Dark</option>
      </select>
      <button id="btnEdit" title="Edit (Ctrl+E)">Edit</button>
      <button id="btnSave" title="Simpan (Ctrl+S)" hidden>Simpan</button>
      <button id="btnPDF" title="Export PDF">PDF</button>
      <button id="btnPNG" title="Export PNG">PNG</button>
    </div>
  </header>
  <main>
    <article id="preview" class="markdown-body"></article>
    <textarea id="editor" spellcheck="false" hidden></textarea>
  </main>
  <script src="vendor/marked.umd.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/html-to-image.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
